[package]
name = "wgpu-3dgs-editor"
version = "0.5.0"
edition = "2024"
authors = ["Lio Qing"]
license = "MIT OR Apache-2.0"
description = "A 3D Gaussian splatting editing library written in Rust using wgpu."
readme = "README.md"
include = [
    "README.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
    "CHANGELOG.md",
    "Cargo.toml",
    "examples/**/*",
    "src/**/*",
]
repository = "https://github.com/LioQing/wgpu-3dgs-editor"
homepage = "https://github.com/LioQing/wgpu-3dgs-editor"
keywords = ["gaussian-splatting", "point-cloud", "wgpu", "graphics", "ply"]
categories = ["graphics", "wasm"]

[lib]
name = "wgpu_3dgs_editor"
path = "src/lib.rs"

[[example]]
name = "filter-selection"
path = "examples/filter_selection.rs"
doc-scrape-examples = true

[[example]]
name = "modify"
path = "examples/modify.rs"
doc-scrape-examples = true

[[example]]
name = "modify-selection"
path = "examples/modify_selection.rs"
doc-scrape-examples = true

[[example]]
name = "custom-modify-selection"
path = "examples/custom_modify_selection.rs"
doc-scrape-examples = true

[package.metadata.docs.rs]
all-features = true
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]

[dependencies]
wgpu-3dgs-core = { version = "0.5" }

# For local development:
# wgpu-3dgs-core = { path = "../wgpu-3dgs-core" }

# For developing against latest upstream:
# wgpu-3dgs-core = { git = "https://github.com/LioQing/wgpu-3dgs-core" }

bytemuck = { version = "1.23", features = [
    "derive",
    "extern_crate_alloc",
    "min_const_generics",
] }
bitflags = { version = "2.10", features = ["bytemuck"] }
glam = { version = "0.30", features = ["bytemuck"] }
half = { version = "2.6", features = ["bytemuck"] }
log = "0.4"
paste = "1.0"
thiserror = "2.0"
wgpu = "27.0"
wesl = "0.2"

[dev-dependencies]
assert_matches = { version = "1.5" }
clap = { version = "4.5", features = ["derive"] }
env_logger = { version = "0.11" }
pollster = { version = "0.4", features = ["macro"] }
winit = { version = "0.30" }
